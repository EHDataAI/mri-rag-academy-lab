name: MRI-RAG RC1 secure QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Bootstrap patched pip
        run: python -m pip install --no-input 'pip==26.2.2'
      - name: Install application dependencies
        run: python -m pip install --no-input -r requirements.txt
      - name: Install test and audit dependencies
        run: python -m pip install --no-input -c constraints-cloud.txt -e '.[dev]'
      - name: Dependencies consistent
        run: python -m pip check
      - name: Syntax and Ruff
        run: |
          python -m compileall -q src tests app.py streamlit_public.py scripts
          python -m ruff check src tests app.py streamlit_public.py scripts
          python -m ruff format --check src tests app.py streamlit_public.py scripts
      - name: Verify corpus
        run: mri-rag preflight
      - name: Build fresh FTS5 index
        run: mri-rag build
      - name: Tests and JUnit
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/results.xml"
      - name: Bandit static analysis
        run: python -m bandit -r src/mri_rag app.py streamlit_public.py scripts -f json -o "$RUNNER_TEMP/bandit.json"
      - name: Audit installed dependencies
        run: python -m pip_audit --format json --output "$RUNNER_TEMP/pip_audit.json"
      - name: Retrieval evaluations
        run: |
          mri-rag eval --split dev --k 3 > "$RUNNER_TEMP/dev.json"
          mri-rag eval --split test --k 3 > "$RUNNER_TEMP/test.json"
      - name: Reproducible quality gates
        run: |
          python - <<'PY_GATE'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          suites_root = ET.parse(root / 'results.xml').getroot()
          suites = ([suites_root] if suites_root.tag == 'testsuite'
                    else suites_root.findall('.//testsuite'))
          assert suites, 'JUnit test suites missing'
          def total(key):
              return sum(int(s.attrib.get(key, '0')) for s in suites)
          assert total('tests') >= 105, f"Expected >=105 tests: {total('tests')}"
          assert not any(total(key) for key in ('errors', 'failures', 'skipped'))
          bandit = json.loads((root / 'bandit.json').read_text(encoding='utf-8'))
          assert not bandit.get('errors') and not bandit.get('results')
          audit = json.loads((root / 'pip_audit.json').read_text(encoding='utf-8'))
          assert not any(dep.get('vulns') for dep in audit.get('dependencies', []))
          dev = json.loads((root / 'dev.json').read_text(encoding='utf-8'))
          test = json.loads((root / 'test.json').read_text(encoding='utf-8'))
          assert (dev['n'], test['n']) == (12, 11)
          assert dev['hit_at_k'] == test['hit_at_k'] == 1.0
          assert dev['mrr_at_k'] >= 0.9167
          assert test['mrr_at_k'] == test['ood_abstention_rate'] == 1.0
          print('CI-R2 QUALITY GATES PASS')
          PY_GATE
      - name: Gitleaks with verified binary
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          artifact="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${artifact}"
          sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error --retry 2 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/$artifact" "$url"
          echo "$sha  $RUNNER_TEMP/$artifact" | sha256sum -c -
          tar -xOzf "$RUNNER_TEMP/$artifact" gitleaks > "$RUNNER_TEMP/gitleaks"
          chmod 700 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
